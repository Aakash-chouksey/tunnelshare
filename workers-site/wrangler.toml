name = "tunnelshare"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Holds the live quick-tunnel URL so /s/<id> keeps working across restarts.
# Create it once, then paste the printed id here:
#   wrangler kv namespace create TUNNEL_KV
[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
